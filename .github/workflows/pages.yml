name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The site never waits for the native engine: it builds only Fretline's core (engine/core)
    # to WebAssembly, so engine-only changes don't deploy at all.
    paths-ignore:
      - 'engine/fretline-engine/**'
      - 'engine/installer/**'
      - 'engine/tests/**'
      - '.github/workflows/channels.yml'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # The Studio in a real browser (web channel only, no engine build): calibration, gauges,
      # layout stability.
      - name: Studio in headless Chromium
        run: |
          npx --yes playwright@1 install --with-deps chromium
          npm install --no-save --prefix tests/e2e playwright@1
          (npx vite preview --port 4180 --strictPort &)
          sleep 3
          node tests/e2e/studio.mjs http://localhost:4180/${{ github.event.repository.name }}/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
