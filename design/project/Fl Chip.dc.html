<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;gap:8px;height:{{ h }}px;padding:0 {{ padX }}px;border-radius:4px;background:{{ bg }};box-shadow:inset 0 0 0 1px {{ edge }};font-family:'Big Shoulders Display','Barlow',sans-serif;font-weight:700;font-size:{{ fs }}px;letter-spacing:0.16em;text-transform:uppercase;color:{{ color }};white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis"><dc-import name="Fl Lamp" tone="{{ lampTone }}" color="{{ lampColor }}" size="{{ lampSize }}" surface="well" pulse="{{ pulse }}" hint-size="7px,7px"></dc-import>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:50},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;IN TUNE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ok&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;on&quot;,&quot;ok&quot;,&quot;muted&quot;],&quot;tsType&quot;:&quot;'live'|'on'|'ok'|'muted'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;md&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;tsType&quot;:&quot;'sm'|'md'|'lg'&quot;},&quot;pulse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;color&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tone = p.tone ?? 'ok', size = p.size ?? 'md';
    const TONE = { live: '#d4442c', on: '#e9a23b', ok: '#4db6a4' };
    const c = p.color || TONE[tone];
    const lit = tone !== 'muted' && !!c;
    const S = { sm: [26, 10, 12, 6], md: [30, 12, 13, 7], lg: [34, 14, 16, 7] }[size] ?? [30, 12, 13, 7];
    return {
      h: S[0], padX: S[1], fs: S[2], lampSize: S[3],
      label: p.label ?? '', pulse: !!p.pulse,
      color: lit ? c : '#b8a994', bg: lit ? `${c}1f` : '#0d0b0a', edge: lit ? `${c}80` : '#3b322c',
      lampTone: lit ? 'on' : 'off', lampColor: lit ? c : '',
    };
  }
}
</script>
</body>
</html>
