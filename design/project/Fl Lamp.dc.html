<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes lamp{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</helmet>
<span role="img" aria-label="{{ aria }}" style="display:inline-block;flex:none;width:{{ w }}px;height:{{ h }}px;border-radius:{{ r }}px;background:{{ bg }};box-shadow:{{ glow }};animation:{{ anim }}"></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:40},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;on&quot;,&quot;options&quot;:[&quot;off&quot;,&quot;live&quot;,&quot;on&quot;,&quot;ok&quot;],&quot;tsType&quot;:&quot;'off'|'live'|'on'|'ok'&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dot&quot;,&quot;options&quot;:[&quot;dot&quot;,&quot;bar&quot;],&quot;tsType&quot;:&quot;'dot'|'bar'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:4,&quot;max&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;length&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:10,&quot;max&quot;:80,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;pulse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dark&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;well&quot;,&quot;alu&quot;,&quot;ivory&quot;],&quot;tsType&quot;:&quot;'dark'|'well'|'alu'|'ivory'&quot;},&quot;color&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glow&quot;:{&quot;editor&quot;:null,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tone = p.tone ?? 'on', shape = p.shape ?? 'dot', surface = p.surface ?? 'dark';
    const TONE = { live: '#d4442c', on: '#e9a23b', ok: '#4db6a4' };
    const OFF = { dark: '#3a302a', well: '#15110f', alu: '#8f8679', ivory: '#b9a98a' };
    const lit = tone !== 'off';
    const c = p.color ?? TONE[tone] ?? '#e9a23b';
    const size = Number(p.size ?? 7);
    const bar = shape === 'bar';
    const w = bar ? Number(p.length ?? 30) : size, h = bar ? Number(p.size ?? 4) : size;
    const glowOn = p.glow ?? true;
    return {
      w, h, r: bar ? 2 : size / 2,
      bg: lit ? c : (OFF[surface] ?? OFF.dark),
      glow: lit ? (glowOn ? (bar ? `0 0 12px ${c}, 0 0 2px ${c}` : `0 0 ${Math.max(6, size + 2)}px ${c}`) : 'none') : (surface === 'alu' ? 'inset 0 1px 1px rgba(0,0,0,0.35)' : 'inset 0 1px 2px rgba(0,0,0,0.9)'),
      anim: lit && p.pulse ? 'lamp 1.6s ease-in-out infinite' : 'none',
      aria: p.aria ?? (lit ? tone : 'off'),
    };
  }
}
</script>
</body>
</html>
