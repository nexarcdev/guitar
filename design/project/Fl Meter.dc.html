<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:6px;width:100%;min-width:0">
  <div style="display:flex;align-items:center;gap:8px;height:14px">
    <span style="width:8px;height:8px;border-radius:50%;background:{{ ledBg }};box-shadow:{{ ledGlow }};flex:none"></span>
    <span style="font-family:'Big Shoulders Display','Barlow',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#b8a994;line-height:1;white-space:nowrap">{{ label }}</span>
    <span style="margin-left:auto;font-family:'Barlow',sans-serif;font-size:12px;font-variant-numeric:tabular-nums;color:#efe4c8;line-height:1">{{ readout }}</span>
  </div>
  <div style="position:relative;height:{{ height }}px;border-radius:4px;background:#0b0908;box-shadow:inset 0 2px 4px rgba(0,0,0,0.9),inset 0 -1px 0 rgba(255,255,255,0.05),0 1px 0 rgba(255,255,255,0.05);overflow:hidden">
    <div style="position:absolute;inset:2px;border-radius:2px;background:{{ bands }};-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);opacity:0.18"></div>
    <div style="position:absolute;inset:2px;border-radius:2px;background:{{ bands }};-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);clip-path:inset(0 {{ clipRight }}% 0 0);filter:drop-shadow(0 0 6px {{ glowColor }})"></div>
    <div style="position:absolute;top:2px;bottom:2px;width:2px;left:{{ peakLeft }}%;background:#efe4c8;opacity:{{ peakOpacity }}"></div>
    <div style="position:absolute;top:0;bottom:0;width:2px;left:{{ thrLeft }}%;background:{{ thrColor }};opacity:{{ thrOpacity }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:60},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-24,&quot;min&quot;:-96,&quot;max&quot;:0,&quot;step&quot;:1,&quot;unit&quot;:&quot;dB&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;peak&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-14,&quot;min&quot;:-96,&quot;max&quot;:0,&quot;step&quot;:1,&quot;unit&quot;:&quot;dB&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;threshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-48,&quot;min&quot;:-96,&quot;max&quot;:-6,&quot;step&quot;:1,&quot;unit&quot;:&quot;dB&quot;,&quot;tsType&quot;:&quot;number|null&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Guitar in&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:18,&quot;min&quot;:8,&quot;max&quot;:40,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;live&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e9a23b&quot;,&quot;options&quot;:[&quot;#e9a23b&quot;,&quot;#d4442c&quot;,&quot;#4db6a4&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;hot&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#d4442c&quot;,&quot;options&quot;:[&quot;#d4442c&quot;,&quot;#e9a23b&quot;,&quot;#4db6a4&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;quiet&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4db6a4&quot;,&quot;options&quot;:[&quot;#4db6a4&quot;,&quot;#e9a23b&quot;,&quot;#b8a994&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const MIN = -96;
    const pos = (db) => Math.max(0, Math.min(1, (db - MIN) / -MIN)) * 100;
    const value = p.value ?? -24;
    const peak = p.peak ?? value + 4;
    const thr = p.threshold ?? null;
    const hot = p.hot ?? '#d4442c';
    const warm = p.color ?? '#e9a23b';
    const cool = p.quiet ?? '#4db6a4';
    const t = thr == null ? 0 : pos(thr);
    const h = pos(-6);
    const bands = `linear-gradient(to right, ${cool} 0%, ${cool} ${t}%, ${warm} ${t}%, ${warm} ${h}%, ${hot} ${h}%, ${hot} 100%)`;
    const live = p.live ?? true;
    const open = live && thr != null ? value > thr : live && value > -60;
    return {
      label: p.label ?? 'IN', height: p.height ?? 18, bands,
      clipRight: live ? 100 - pos(value) : 100,
      peakLeft: pos(peak), peakOpacity: live ? 1 : 0,
      thrLeft: t, thrColor: warm, thrOpacity: thr == null ? 0 : 1,
      glowColor: value > -6 ? hot : value > (thr ?? -60) ? warm : cool,
      readout: live ? (value <= -90 ? '−∞' : Math.round(value) + ' dB') : 'off',
      ledBg: open ? cool : '#2a2320', ledGlow: open ? `0 0 8px ${cool}` : 'inset 0 1px 2px rgba(0,0,0,0.8)',
    };
  }
}
</script>
</body>
</html>
