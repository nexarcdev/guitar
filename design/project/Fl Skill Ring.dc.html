<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content">
  <div style="position:relative;width:{{ size }}px;height:{{ size }}px;border-radius:50%;background:{{ ring }};display:grid;place-items:center;box-shadow:{{ glow }}">
    <div style="position:absolute;inset:{{ thick }}px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1e1916,#110e0c);box-shadow:inset 0 2px 6px rgba(0,0,0,0.8)"></div>
    <div style="position:relative;text-align:center;line-height:1">
      <div style="font-family:'Big Shoulders Display','Barlow',sans-serif;font-weight:800;font-size:{{ numSize }}px;color:#efe4c8;letter-spacing:-0.01em">{{ score }}</div>
      <div style="font-family:'Barlow',sans-serif;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:{{ color }};margin-top:3px;font-weight:600">{{ grade }}</div>
    </div>
  </div>
  <div style="font-family:'Big Shoulders Display','Barlow',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:{{ labelColor }};text-align:center;line-height:1.2;max-width:{{ size }}px">{{ label }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:150},&quot;score&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:72,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open chords&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;grade&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;min&quot;:56,&quot;max&quot;:200,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4db6a4&quot;,&quot;options&quot;:[&quot;#4db6a4&quot;,&quot;#e9a23b&quot;,&quot;#d4442c&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const score = Math.max(0, Math.min(100, p.score ?? 72));
    const size = p.size ?? 96;
    const color = p.color ?? '#4db6a4';
    const deg = score * 3.6;
    const ring = `conic-gradient(${color} 0deg ${deg}deg, rgba(255,255,255,0.08) ${deg}deg 360deg)`;
    const grade = p.grade ?? (score >= 90 ? 'Solid' : score >= 70 ? 'Steady' : score >= 40 ? 'Getting there' : 'New');
    return { score, size, color, ring, grade, thick: Math.round(size / 11), numSize: Math.round(size / 3), glow: `0 0 ${Math.round(size / 5)}px ${color}44`, label: p.label ?? '', labelColor: p.labelColor ?? '#b8a994' };
  }
}
</script>
</body>
</html>
