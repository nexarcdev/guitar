<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;flex:{{ flex }};min-width:0;min-height:{{ minH }};border-radius:{{ r }}px;background:{{ bg }};box-shadow:{{ shadow }};color:{{ ink }};display:flex;flex-direction:column;gap:{{ gap }}px;padding:{{ pad }};overflow:hidden">
  <sc-if value="{{ paper }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(80,50,10,0.05) 0 1px,transparent 1px 3px);pointer-events:none;mix-blend-mode:multiply"></div></sc-if>
  <sc-if value="{{ hasHead }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
      <div style="min-width:0"><sc-if value="{{ hasKicker }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:{{ kickerColor }};font-weight:700">{{ kicker }}</div></sc-if><div style="font-family:'Big Shoulders Display','Barlow',sans-serif;font-weight:800;font-size:{{ titleSize }}px;line-height:1;color:{{ titleColor }};margin-top:4px;letter-spacing:0.02em">{{ title }}</div></div>
      <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:{{ kickerColor }};font-weight:600;text-align:right;line-height:1.5">{{ meta }}</div>
    </div>
  </sc-if>
  {{ children }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:240},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;glass&quot;,&quot;options&quot;:[&quot;glass&quot;,&quot;paper&quot;],&quot;tsType&quot;:&quot;'glass'|'paper'&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;minHeight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:0,&quot;max&quot;:40,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;flex&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;1 1 auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const paper = (p.surface ?? 'glass') === 'paper';
    return {
      paper, children: p.children ?? null,
      flex: p.flex ?? '1 1 auto', minH: p.minHeight ?? '0', r: paper ? 3 : 6, gap: Number(p.gap ?? 14),
      pad: p.pad ?? (paper ? '18px 22px 16px' : '18px 20px'),
      bg: paper ? 'radial-gradient(120% 90% at 50% 40%,#e8d6ad 0%,#dcc492 55%,#c9ad74 100%)' : 'radial-gradient(120% 80% at 50% 100%,#15110f,#070605 80%)',
      shadow: paper ? 'inset 0 0 0 1px rgba(90,60,20,0.25),inset 0 0 60px rgba(90,60,20,0.4),0 2px 0 rgba(0,0,0,0.35),0 10px 24px rgba(0,0,0,0.45)' : 'inset 0 3px 10px rgba(0,0,0,0.95),inset 0 0 0 1px rgba(0,0,0,0.8),0 1px 0 rgba(255,235,210,0.06)',
      ink: paper ? '#3a2a1a' : '#efe4c8',
      hasHead: !!(p.title || p.meta), hasKicker: !!p.kicker, kicker: p.kicker ?? '', title: p.title ?? '', meta: p.meta ?? '',
      titleSize: p.titleSize ?? 28, titleColor: paper ? '#2b1d10' : '#efe4c8', kickerColor: paper ? '#6b5636' : '#8f8272',
    };
  }
}
</script>
</body>
</html>
