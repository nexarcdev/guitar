[package]
name = "fretline-engine"
version = "0.1.0"
edition = "2021"
description = "Fretline low-latency audio engine: guitar in → pedals → speakers at a few milliseconds, controlled by the Fretline web app over localhost."
license = "MIT"

[dependencies]
fretline-core = { path = "../core" }
tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.4"
crossbeam-channel = "0.5"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
